<style>
/* Layout: an app shell with a moon-and-clouds header, soft pastel cards, a floating pill tab bar. One narrow column per tab (Today, Log, Growth, Schedules), a fixed bottom tab bar, sheets for entry forms. Nothing scrolls sideways. */
:root {
  --bg: #FFF6F4; --surface: #FFFFFF; --sunk: #FBEDEC; --fg: #3B2E3C; --muted: #7C6878; --line: #F1DEDD;
  --accent: #CF5F86; --accent-soft: #FCE4EC; --on-accent: #FFFFFF; --shadow: 0 6px 18px rgba(207,95,134,.10);
  --sleep: #8587DD; --sleep-soft: #ECEBFB; --feed: #DD8C42; --feed-soft: #FDEBD8; --solids: #5FA571; --solids-soft: #E4F3E7; --bed: #A974C2; --night: #7983A6; --wake: #E6B23C; --diaper: #4FA9B9; --diaper-soft: #E0F3F6;
  --note-bg: #FFF4D8; --note-fg: #6A4C10; --now-bg: #FFF0C4; --danger: #C2413B; --band1: #F3F0FC; --band2: #E2DDF8;
  --sky1: #FFE3EC; --sky2: #E8E6FF; --cloud: #FFFFFF; --moon: #F6CF62; --star: #F2B6CB;
  --display: "Fredoka", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13132A; --surface: #1D1D38; --sunk: #26264A; --fg: #EFE8F3; --muted: #ABA4C4; --line: #2F2F57;
  --accent: #F3A2BF; --accent-soft: #3A2443; --on-accent: #13132A; --shadow: 0 6px 18px rgba(0,0,0,.28);
  --sleep: #B3B4F5; --sleep-soft: #2B2B57; --feed: #F2B27A; --feed-soft: #3B2B28; --solids: #9AD3A8; --solids-soft: #213A2B; --bed: #D4A9E4; --night: #A8B1D6; --wake: #F5D06B; --diaper: #8ED5E0; --diaper-soft: #1F3840;
  --note-bg: #2C2537; --note-fg: #F2DDAF; --now-bg: #3A3120; --danger: #F59A9A; --band1: #22223F; --band2: #2F2F5C;
  --sky1: #1E1E44; --sky2: #2B2557; --cloud: #34346A; --moon: #F8DA82; --star: #F8E7A8; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13132A; --surface: #1D1D38; --sunk: #26264A; --fg: #EFE8F3; --muted: #ABA4C4; --line: #2F2F57;
  --accent: #F3A2BF; --accent-soft: #3A2443; --on-accent: #13132A; --shadow: 0 6px 18px rgba(0,0,0,.28);
  --sleep: #B3B4F5; --sleep-soft: #2B2B57; --feed: #F2B27A; --feed-soft: #3B2B28; --solids: #9AD3A8; --solids-soft: #213A2B; --bed: #D4A9E4; --night: #A8B1D6; --wake: #F5D06B; --diaper: #8ED5E0; --diaper-soft: #1F3840;
  --note-bg: #2C2537; --note-fg: #F2DDAF; --now-bg: #3A3120; --danger: #F59A9A; --band1: #22223F; --band2: #2F2F5C;
  --sky1: #1E1E44; --sky2: #2B2557; --cloud: #34346A; --moon: #F8DA82; --star: #F8E7A8; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); margin: 0; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.9rem; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; }
h3 { font-size: 1rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top .sub { color: var(--muted); font-size: .9rem; }
.icon-btn { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; min-height: 40px; cursor: pointer; font-size: .9rem; flex: none; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.banner { border-radius: 12px; padding: 12px 14px; font-size: .9rem; background: var(--accent-soft); display: grid; gap: 8px; }
.banner.warn { background: var(--note-bg); color: var(--note-fg); }

/* Today */
.hero { display: grid; gap: 4px; }
.hero .big { font-family: var(--display); font-size: 1.5rem; line-height: 1.2; }
.status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-box { background: var(--sunk); border-radius: 12px; padding: 12px; min-width: 0; display: grid; gap: 2px; align-content: start; }
.stat-box .v { font-family: var(--display); font-size: 1.25rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat-box .d { font-size: .82rem; color: var(--muted); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act { border: 0; border-radius: 14px; padding: 14px 12px; min-height: 64px; cursor: pointer; text-align: left; display: grid; gap: 2px; background: var(--sunk); }
.act .t { font-weight: 700; font-size: 1.02rem; display: flex; align-items: center; gap: 8px; }
.act .s { font-size: .8rem; color: var(--muted); }
.act.sleep { background: var(--sleep-soft); } .act.feed { background: var(--feed-soft); }
.act.live { outline: 2px solid currentColor; }
.act[disabled] { opacity: .5; cursor: default; }
.live-box { border-radius: 14px; padding: 14px; display: grid; gap: 10px; grid-column: 1 / -1; }
.live-box.sleep { background: var(--sleep-soft); } .live-box.feed { background: var(--feed-soft); }
.live-box .timer { font-family: var(--display); font-size: 2rem; font-variant-numeric: tabular-nums; line-height: 1; }
.live-box .row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 0 16px; min-height: 44px; font-weight: 700; cursor: pointer; background: var(--accent); color: var(--on-accent); }
.btn.alt { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.wide { width: 100%; }
.next-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.next-list li { display: grid; grid-template-columns: 6.2em 1fr auto; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: 10px; background: var(--sunk); }
.next-list li:first-child { background: var(--now-bg); }
.next-list .in { font-size: .8rem; color: var(--muted); white-space: nowrap; }
.totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.totals div { background: var(--sunk); border-radius: 10px; padding: 8px 4px; min-width: 0; }
.totals .v { font-family: var(--display); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.totals .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }

/* timeline */
.tl svg { display: block; width: 100%; height: 44px; border-radius: 8px; background: var(--sunk); }
.tl .ticks { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.k-wake { background: var(--wake); } .k-feed, .k-nurse, .k-bottle { background: var(--feed); } .k-solids { background: var(--solids); }
.k-sleep { background: var(--sleep); } .k-bed { background: var(--bed); } .k-night { background: var(--night); } .k-diaper { background: var(--diaper); }

/* Log */
.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav h2 { font-size: 1.1rem; text-align: center; flex: 1; }
.daynav button { min-width: 44px; }
.entries { list-style: none; margin: 0; padding: 0; }
.entries li { display: grid; grid-template-columns: 5.4em 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.entries li:last-child { border-bottom: 0; }
.entries .tm { font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; }
.entries .what { display: flex; align-items: center; gap: 8px; min-width: 0; }
.entries .what span { overflow-wrap: anywhere; }
.entries .edit { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: .82rem; color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; }
.chart svg { display: block; width: 100%; height: auto; }

/* Growth */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--sunk); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; min-height: 38px; cursor: pointer; font-weight: 700; font-size: .9rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pct-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pct { background: var(--sunk); border-radius: 12px; padding: 10px; min-width: 0; display: grid; gap: 2px; }
.pct .v { font-family: var(--display); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.pct .p { font-size: .82rem; color: var(--muted); }
.mlist { list-style: none; margin: 0; padding: 0; }
.mlist li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.mlist li:last-child { border-bottom: 0; }

/* Schedules */
.agepick { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.agepick select, .field input, .field select, .field textarea { background: var(--sunk); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; min-width: 0; }
.agepick button { min-height: 46px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stat { background: var(--sunk); border-radius: 8px; padding: 5px 10px; font-size: .84rem; font-variant-numeric: tabular-nums; }
.stat b { color: var(--muted); font-weight: 700; margin-right: 4px; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; }
.badge { font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); padding: 3px 9px; border-radius: 999px; }
.sched ol { list-style: none; margin: 0; padding: 0; }
.sched li { display: grid; grid-template-columns: 8.2em 1fr; gap: 8px; padding: 8px 6px; border-bottom: 1px solid var(--line); align-items: baseline; border-radius: 6px; }
.sched li:last-child { border-bottom: 0; }
.sched .tm { font-variant-numeric: tabular-nums; font-weight: 700; font-size: .88rem; }
.sched .ac { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sched li.night .tm, .sched li.night .ac { color: var(--muted); }
.sched li.now { background: var(--now-bg); }
.nowtag { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; background: var(--fg); color: var(--bg); border-radius: 4px; padding: 1px 6px; margin-left: auto; }
.shifted { font: 400 .8rem var(--body); color: var(--accent); }
.notes { background: var(--sunk); border-radius: 10px; padding: 12px 14px; font-size: .92rem; }
.notes ul, .plain-list { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.ref-list { display: grid; gap: 8px; }
.ref-item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: transparent; text-align: left; cursor: pointer; display: grid; gap: 6px; width: 100%; }
.ref-item.mine { border-color: var(--accent); background: var(--accent-soft); }
.ref-item .h { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.ref-item dl { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 4px 12px; font-size: .85rem; }
.ref-item dt { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.ref-item dd { margin: 0 0 2px; font-variant-numeric: tabular-nums; }
details.fold > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "Show"; font: 700 .8rem var(--body); color: var(--accent); }
details.fold[open] > summary::after { content: "Hide"; }
details.fold[open] > summary { margin-bottom: 10px; }
.safe { background: var(--note-bg); color: var(--note-fg); border-color: transparent; }
.safe summary::after { color: var(--note-fg) !important; }

.field { display: grid; gap: 6px; min-width: 0; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { display: flex; flex-wrap: wrap; gap: 6px; }
.choice button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 42px; cursor: pointer; }
.choice button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; }
.stepper { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; }
.stepper button { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 1.3rem; cursor: pointer; }
.stepper output { text-align: center; font-family: var(--display); font-size: 1.4rem; font-variant-numeric: tabular-nums; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar nav { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tabbar a { text-decoration: none; color: var(--muted); display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 10px; font-size: .78rem; font-weight: 700; min-height: 50px; }
.tabbar a svg { width: 24px; height: 24px; }
.tabbar a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,12,15,.45); z-index: 40; display: grid; align-items: end; justify-items: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; max-height: 92%; overflow-y: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.sheet .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet .foot { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .foot .btn { flex: 1; }
.sheet .err { color: var(--danger); font-size: .88rem; min-height: 1.2em; }
.confirm { display: grid; gap: 8px; background: var(--sunk); border-radius: 10px; padding: 12px; }
textarea { resize: vertical; }

@media (min-width: 560px) { .sheet-bg { align-items: center; } .sheet { border-radius: 18px; } }
@media (max-width: 360px) { .status-grid, .actions { grid-template-columns: 1fr; } .totals { grid-template-columns: 1fr 1fr; } .pct-grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

/* ---- cute layer ---- */
body { font-weight: 600; }
h1, h2, h3 { font-weight: 600; letter-spacing: 0; }
.card, .stat-box, .pct { border-radius: 22px; }
.card { border: 1px solid var(--line); box-shadow: var(--shadow); }
.stat-box, .pct { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.stat-box .v, .pct .v, .totals .v, .live-box .timer, .stepper output, .hero .big { font-weight: 600; }
.banner { border-radius: 18px; }
.btn, .icon-btn, .choice button, .seg, .seg button, .entries .edit { border-radius: 999px; }
.btn { font-weight: 800; }
.label { font-weight: 800; }
.sky { position: relative; border-radius: 26px; overflow: hidden; background: linear-gradient(160deg, var(--sky1), var(--sky2)); padding: 22px 20px 20px; min-height: 132px; display: grid; align-content: end; gap: 2px; box-shadow: var(--shadow); }
.sky svg.art { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.sky h1 { position: relative; font-size: 2.15rem; font-weight: 700; color: var(--fg); }
.sky .sub { position: relative; color: var(--muted); font-weight: 700; }
.sky .icon-btn { position: absolute; top: 14px; right: 14px; background: var(--surface); border-color: transparent; box-shadow: var(--shadow); font-weight: 800; }
.hero { background: var(--accent-soft); border-color: transparent; box-shadow: none; }
.hero .big { color: var(--fg); }
.act { border-radius: 22px; min-height: 76px; grid-template-columns: 40px 1fr; align-items: center; column-gap: 10px; }
.act .ic { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; }
.act .ic svg { width: 24px; height: 24px; }
.act .t { gap: 0; }
.act.diaper { background: var(--diaper-soft); } .act.solids { background: var(--solids-soft); } .act.plain { background: var(--surface); border: 1.5px dashed var(--line); }
.act:active { transform: scale(.98); }
.live-box { border-radius: 22px; }
.next-list li, .totals div, .notes { border-radius: 16px; }
.tl svg { border-radius: 12px; }
.tabbar { background: transparent; border-top: 0; pointer-events: none; }
.tabbar nav { pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.12); max-width: 460px; }
.tabbar a { border-radius: 999px; font-weight: 800; min-height: 48px; }
.sheet { border-radius: 26px 26px 0 0; }
@media (min-width: 560px) { .sheet { border-radius: 26px; } }
.ref-item, .ref-item.mine { border-radius: 18px; }
@media (prefers-reduced-motion: no-preference) { .twinkle { animation: tw 3.2s ease-in-out infinite; } .twinkle:nth-child(2n) { animation-delay: 1.1s; } .twinkle:nth-child(3n) { animation-delay: 2s; }
  @keyframes tw { 0%,100% { opacity: .9 } 50% { opacity: .35 } } }

/* milestones */
.firsts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.first { border: 1.5px dashed var(--line); background: transparent; border-radius: 18px; padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; min-height: 78px; align-content: start; }
.first.done { border: 1.5px solid transparent; background: var(--accent-soft); }
.first .star { color: var(--wake); font-size: 1.1rem; line-height: 1; }
.first .ft { font-weight: 800; font-size: .92rem; line-height: 1.25; }
.first .fd { font-size: .78rem; color: var(--muted); }
.first.done .fd { color: var(--fg); }
.big-title { font-family: var(--display); font-size: 1.2rem; font-weight: 600; }
.cdc > summary { font-size: 1rem; }
.prog { font: 800 .8rem var(--body); color: var(--muted); margin-left: 6px; }
.checks { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 4px; }
.chk { width: 100%; display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; text-align: left; background: transparent; border: 0; padding: 8px 4px; border-radius: 12px; cursor: pointer; }
.chk .box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; color: var(--on-accent); font-size: .85rem; }
.chk.on .box { background: var(--solids); border-color: var(--solids); }
.chk .cd { font-size: .76rem; color: var(--muted); white-space: nowrap; }
.chk:hover { background: var(--sunk); }
.nextvisit { background: var(--now-bg); border-radius: 14px; padding: 10px 12px; }
.visits { display: grid; gap: 8px; }
.visit { border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.visit.next { border-color: var(--accent); }
.visit > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.visit > summary::-webkit-details-marker { display: none; }
.visit .vn { font-weight: 800; }
.vbody { display: grid; gap: 10px; margin-top: 10px; }
.vbody .row { display: flex; gap: 8px; flex-wrap: wrap; }
.vnote p { margin-top: 4px; white-space: pre-wrap; }
.chip { font-size: .76rem; font-weight: 800; border-radius: 999px; padding: 3px 10px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--solids-soft); color: var(--solids); }
.chip.soon { background: var(--now-bg); color: var(--note-fg); }
.chip.warn { background: var(--feed-soft); color: var(--feed); }
.visit-alert { text-decoration: none; color: var(--fg); background: var(--now-bg); border-color: transparent; gap: 4px; }
.tabbar a { font-size: .7rem; padding: 6px 0; }
@media (max-width: 370px) { .tabbar a { font-size: .62rem; } }

/* round 3 */
.field-row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 400px) { .field-row3 { grid-template-columns: 1fr 1fr; } }
.chips, .filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; min-height: 40px; cursor: pointer; font-weight: 700; font-size: .9rem; }
.chipbtn.h { background: var(--feed-soft); border-color: transparent; }
.chipbtn.sel { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.filters .chipbtn { min-height: 34px; padding: 5px 12px; font-size: .82rem; }
.health-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: .92rem; }
.health-lines li { display: flex; gap: 8px; align-items: center; }
.live-box.act { background: var(--accent-soft); }
.sides { display: flex; gap: 16px; font-size: .92rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sides .on { color: var(--fg); }
.k-act { background: var(--bed); } .k-health { background: var(--danger); } .k-pump { background: var(--feed); }
.mtiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mtile { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 8px 4px; display: grid; gap: 0; text-align: center; cursor: pointer; min-width: 0; }
.mtile .mt { font-family: var(--display); font-weight: 600; font-size: 1rem; }
.mtile .md { font-size: .74rem; color: var(--muted); }
.mtile .mp { font-size: .74rem; font-weight: 800; color: var(--accent); }
.mtile.cur { border-color: var(--accent); background: var(--accent-soft); }
.mtile.full .mp { color: var(--solids); }
.uplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.uprow { width: 100%; display: grid; grid-template-columns: 7.6em 1fr auto; gap: 10px; align-items: center; text-align: left; background: var(--sunk); border: 0; border-radius: 14px; padding: 9px 12px; cursor: pointer; text-decoration: none; color: var(--fg); font-size: .9rem; }
.uprow .ud { font-weight: 800; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.uprow .ua { font-size: .78rem; font-weight: 800; color: var(--accent); }
.cat { display: grid; gap: 2px; margin-bottom: 6px; }
.cat .label { padding: 4px 4px 0; }
.cat-social { color: var(--accent); } .cat-language { color: var(--diaper); } .cat-cognitive { color: var(--sleep); } .cat-movement { color: var(--solids); }
#visits { scroll-margin-top: 16px; }
.uprow.first-up { grid-template-columns: 1fr auto; }

/* round 4: tabs */
.backlink { justify-self: start; text-decoration: none; color: var(--accent); font-weight: 800; padding: 4px 2px; }
.atiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.atile { border: 0; background: var(--sunk); border-radius: 20px; padding: 12px; min-height: 84px; text-align: left; cursor: pointer; display: grid; grid-template-columns: 40px 1fr; column-gap: 10px; align-items: center; }
.atile .ai { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 1.25rem; }
.atile .an { font-weight: 800; }
.atile .as { font-size: .8rem; color: var(--muted); }
.atile.on { background: var(--accent-soft); outline: 2px solid var(--accent); }
.entries li.dayhead { display: block; border-bottom: 0; padding: 12px 2px 2px; font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.status-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.status-list li { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: var(--sunk); border-radius: 14px; padding: 10px 12px; font-size: .92rem; }
.act .ic span { font-size: 1.25rem; line-height: 1; }
.health-mini { text-decoration: none; color: var(--fg); gap: 6px; }
.more-list { padding: 6px; gap: 0; }
.more-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 14px 10px; text-decoration: none; color: var(--fg); border-radius: 16px; }
.more-row + .more-row { border-top: 1px solid var(--line); }
.more-row .mi { width: 44px; height: 44px; border-radius: 50%; background: var(--sunk); display: grid; place-items: center; font-size: 1.3rem; }
.more-row .chev { color: var(--muted); font-size: 1.4rem; }
.tabbar a { font-size: .72rem; }

/* round 5 */
.report-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.multi { display: flex; flex-wrap: wrap; gap: 6px; }
.multi button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px; min-height: 40px; cursor: pointer; font-weight: 700; font-size: .88rem; }
.multi button[aria-pressed="true"] { background: var(--solids); border-color: var(--solids); color: var(--on-accent); }
.report-sheet { max-width: 720px; }
.report-preview { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; font-size: .9rem; overflow-x: auto; }
.report-preview h1 { font-size: 1.2rem; } .report-preview h2 { font-size: 1rem; margin: 14px 0 4px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.report-preview table { border-collapse: collapse; width: 100%; font-size: .86rem; } .report-preview th, .report-preview td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.report-preview th { color: var(--muted); font-weight: 700; } .report-preview .muted { color: var(--muted); } .report-preview ul { padding-left: 18px; margin: 4px 0; }
.week-card .size { display: grid; gap: 2px; background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; }
.week-card .sz { font-family: var(--display); font-size: 1.5rem; font-weight: 600; }
.week-card .wk p { margin-top: 2px; }
.week-card .tip { background: var(--note-bg); color: var(--note-fg); border-radius: 14px; padding: 10px 12px; }
.water { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; }
.water .cups { text-align: center; overflow-wrap: anywhere; }
.moods { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.moods button { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 6px 2px; display: grid; justify-items: center; cursor: pointer; }
.moods button span:first-child { font-size: 1.5rem; }
.moods button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
</style>

// The text is written for a girl named "Ayla"; px() swaps in the baby's name and pronouns from Settings.
const babyName = () => (S.settings.babyName || "").trim() || "Baby";
function px(str) {
  if (str == null) return str; let t = String(str);
  t = t.replace(/\bAyla\b/g, babyName());
  if (S.settings.sex === "boy") {
    t = t.replace(/make her laugh/g, "make him laugh").replace(/talk to her/g, "talk to him").replace(/dress her/g, "dress him")
      .replace(/other girls her age/g, "other boys his age").replace(/for girls/g, "for boys")
      .replace(/\bherself\b/g, "himself").replace(/\bHer\b/g, "His").replace(/\bher\b/g, "his").replace(/\bShe\b/g, "He").replace(/\bshe\b/g, "he");
  }
  return t;
}
function pxTree(root) {
  if (!root || (S.settings.sex !== "boy" && babyName() === "Ayla")) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) { const v = px(n.nodeValue); if (v !== n.nodeValue) n.nodeValue = v; }
  root.querySelectorAll("[placeholder],[aria-label],[title]").forEach(el => ["placeholder","aria-label","title"].forEach(a => { if (el.hasAttribute(a)) el.setAttribute(a, px(el.getAttribute(a))); }));
}

  if (use24()) return `${String(h).padStart(2,"0")}:${mm}`;
  return `${h%12||12}:${mm}` + (ap ? (h < 12 ? " am" : " pm") : ""); }
function clockRange(a, b) { if (use24()) return `${clock(a)}–${clock(b)}`; return ((norm(a) < 720) === (norm(b) < 720)) ? `${clock(a,false)}–${clock(b)}` : `${clock(a)}–${clock(b)}`; }
const tsMin = t => { const d = new Date(t); return d.getHours()*60 + d.getMinutes(); };

  return h ? `${h}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}` : `${m}:${String(ss).padStart(2,"0")}`; }

function lmsAt(kind, months) {
  const t = (S.settings.sex === "boy" ? WHO_BOYS : WHO_GIRLS)[kind]; const m = Math.min(Math.max(months, 0), t.length - 1);
  const i = Math.min(Math.floor(m), t.length - 2), f = m - i;
  return t[i].map((v, k) => v + (t[i+1][k] - v) * f);
}

function valueAtZ(kind, months, z) { const [L, M, S] = lmsAt(kind, months); return L === 0 ? M*Math.exp(S*z) : M*Math.pow(1 + L*S*z, 1/L); }

  const t = 1/(1+0.2316419*Math.abs(z)); const d = 0.3989422804014327*Math.exp(-z*z/2);
  const p = d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z > 0 ? 1-p : p;
}

  const r = Math.round(n); const suf = (r%100>=11 && r%100<=13) ? "th" : ({1:"st",2:"nd",3:"rd"}[r%10] || "th"); return `${r}${suf}`; }

// ---------- age ----------
function ageInfo(bdayStr, at = Date.now()) {
  if (!bdayStr) return null;
  const bd = parseYmd(bdayStr), today = dayStart(at);
  const days = Math.round((today - bd) / DAY);
  if (days < 0) return { days, id: "newborn", unborn: true, months: -1, ageMonths: -1, text: `${-days} day${days===-1?'':'s'} until Ayla arrives` };
  const weeks = Math.floor(days/7), b = new Date(bd), n = new Date(today);
  let months = (n.getFullYear()-b.getFullYear())*12 + n.getMonth()-b.getMonth(); if (n.getDate() < b.getDate()) months--;
  let id;
  if (weeks < 4) id = "newborn"; else if (weeks < 8) id = "m1"; else if (weeks < 12) id = "m2"; else if (weeks < 16) id = "m3";
  else if (months <= 4) id = "m4"; else if (months === 5) id = "m5";
  else if (months <= 7) id = "m6"; else if (months <= 9) id = "m8"; else if (months <= 11) id = "m10";
  else if (months === 12) id = "m12"; else if (months < 18) id = "m13"; else if (months < 24) id = "m18"; else id = "m24";
  const text = days === 0 ? "Born today. Welcome, Ayla!" : months < 4 ? `${weeks} week${weeks===1?'':'s'}${days%7 ? ", " + (days%7) + " day" + (days%7===1?'':'s') : ''} old` : `${months} months old`;
  return { days, weeks, months, id, text, ageMonths: days / 30.4375 };
}

// ---------- store: shared (db) with phone-only fallback ----------
const S = {
  mode: "local", canWrite: true, db: null,
  events: new Map(), growth: new Map(), settings: {}, subs: {},
  col: { firsts: new Map(), checks: new Map(), visits: new Map(), vaccines: new Map() },
  localData() { try { return JSON.parse(local.get("ayla-data") || "{}"); } catch(e) { return {}; } },
  saveLocal() { local.set("ayla-data", JSON.stringify({ events: Object.fromEntries(this.events), growth: Object.fromEntries(this.growth), settings: this.settings,
    ...Object.fromEntries(Object.entries(this.col).map(([k, m]) => [k, Object.fromEntries(m)])) })); },
  loadLocal() { const d = this.localData();
    this.events = new Map(Object.entries(d.events || {})); this.growth = new Map(Object.entries(d.growth || {}));
    this.settings = d.settings || {}; if (!this.settings.birthday && local.get("bday")) this.settings.birthday = local.get("bday");
    for (const c of Object.keys(this.col)) this.col[c] = new Map(Object.entries(d[c] || {})); },
  evPath(e) { return `months/${monthKey(e.start)}/events/${e.id}`; },
  async w(sharedFn, redo) {
    try { await sharedFn(); }
    catch (err) {
      if (err?.code !== "invalid_argument" || this.mode !== "shared") throw err;
      this.toLocal(); await redo(); toast("Saved on this phone only.");
    }
  },
  toLocal() {
    Object.values(this.subs).forEach(u => { try { u(); } catch(e) {} }); this.subs = {};
    (this.unsubs || []).forEach(u => { try { u(); } catch(e) {} }); this.unsubs = [];
    this.mode = "local"; this.noShare = true; this.db = null; this.canWrite = true; this.pendingImport = null; this.loadLocal(); render();
  },
  async putEvent(e, prev) {
    this.events.set(e.id, e); render();
    if (this.mode === "shared") await this.w(async () => { if (prev && prev.start && monthKey(prev.start) !== monthKey(e.start)) await this.db.doc(this.evPath(prev)).delete();
        await this.db.doc(this.evPath(e)).set(e); }, () => this.putEvent(e));
    else this.saveLocal();
  },
  async delEvent(e) { this.events.delete(e.id); render();
    if (this.mode === "shared") await this.w(() => this.db.doc(this.evPath(e)).delete(), () => this.delEvent(e)); else this.saveLocal(); },
  async putGrowth(g) { this.growth.set(g.id, g); render();
    if (this.mode === "shared") await this.w(() => this.db.doc(`growth/${g.id}`).set(g), () => this.putGrowth(g)); else this.saveLocal(); },
  async delGrowth(g) { this.growth.delete(g.id); render();
    if (this.mode === "shared") await this.w(() => this.db.doc(`growth/${g.id}`).delete(), () => this.delGrowth(g)); else this.saveLocal(); },
  async putSettings(patch) { Object.assign(this.settings, patch); render();
    if (this.mode === "shared") await this.w(() => this.db.doc("settings/main").set({ ...this.settings }), () => this.putSettings(patch)); else this.saveLocal(); },
  async putDoc(c, o) { this.col[c].set(o.id, o); render();
    if (this.mode === "shared") await this.w(() => this.db.doc(`${c}/${o.id}`).set(o), () => this.putDoc(c, o)); else this.saveLocal(); },
  async delDoc(c, o) { this.col[c].delete(o.id); render();
    if (this.mode === "shared") await this.w(() => this.db.doc(`${c}/${o.id}`).delete(), () => this.delDoc(c, o)); else this.saveLocal(); },
  watchMonth(key) {
    if (this.mode !== "shared" || this.subs[key]) return;
    this.subs[key] = this.db.collection(`months/${key}/events`).onSnapshot(snap => {
      if (this.mode !== "shared") return;
      for (const [id, e] of this.events) if (monthKey(e.start) === key) this.events.delete(id);
      snap.docs.forEach(d => this.events.set(d.id, { ...d.data(), id: d.id }));
      render();
    }, () => {});
  },
  ensureMonths(t) { this.watchMonth(monthKey(t)); this.watchMonth(monthKey(dayStart(t) - 1)); this.watchMonth(monthKey(t + DAY*2)); }
};

async function initShared() {
  if (!window.claude?.use) return;
  let db = null, user = null;
  try { db = await window.claude.use("db"); } catch(e) {}
  if (!db) return;
  try { user = await window.claude.use("user"); } catch(e) {}
  let canWrite = true;
  try { const c = user ? await user.can("data.write") : null; if (c === false) canWrite = false; } catch(e) {}
  if (!canWrite) { S.noShare = true; render(); return; }
  const localBackup = { events: new Map(S.events), growth: new Map(S.growth), settings: { ...S.settings }, col: Object.fromEntries(Object.entries(S.col).map(([k, m]) => [k, new Map(m)])) };
  S.db = db; S.mode = "shared"; S.canWrite = canWrite;
  S.events = new Map(); S.growth = new Map(); for (const c of Object.keys(S.col)) S.col[c] = new Map();
  const localCount = localBackup.events.size + localBackup.growth.size + Object.values(localBackup.col).reduce((n, m) => n + m.size, 0);
  S.pendingImport = localCount ? Object.assign(localBackup, { count: localCount }) : null;
  S.unsubs = [];
  S.unsubs.push(db.doc("settings/main").onSnapshot(d => {
    if (S.mode !== "shared") return;
    if (d.exists) S.settings = { ...d.data() };
    else if (localBackup.settings.birthday && S.canWrite) { S.settings = { ...localBackup.settings }; db.doc("settings/main").set({ ...S.settings }).catch(() => {}); }
    render();

const inFilter = e => logFilter === "all" || kindOf(e) === logFilter || (logFilter === "feed" && (e.type === "solids" || e.type === "pump")) || (logFilter === "diaper" && e.type === "potty");
function renderLog() {
  const t0 = logDay, t1 = t0 + DAY, now = Date.now(), D = dis();

  const tot = dayTotals(t0);

  const maxH = Math.max(16, ...vals.map(v => v.sleep / HOUR)), H = 120, BW = 34, GAP = 14, CW = 7*BW + 6*GAP;
  const bars = vals.map((v, i) => { const hN = v.night / HOUR / maxH * H, hD = v.nap / HOUR / maxH * H, x = i*(BW+GAP), top = H - hN - hD + 18;
    return `<rect x="${x}" y="${H - hN + 18}" width="${BW}" height="${Math.max(hN, 1)}" rx="4" fill="var(--sleep)" opacity="${days[i] === t0 ? 1 : .6}"/>

    <div class="card">

      ${timelineSVG(t0, ev)}

const GKINDS = { weight: { label: "Weight", field: "weightKg", fmt: v => fmtWeight(v), toUnit: v => metric() ? v : v / KG_PER_LB, unit: () => metric() ? "kg" : "lb" },
                 length: { label: "Length", field: "lengthCm", fmt: v => fmtLen(v), toUnit: v => metric() ? v : v / CM_PER_IN, unit: () => metric() ? "cm" : "in" },

function growthRows() { return [...S.growth.values()].sort((a, b) => a.date < b.date ? -1 : 1); }
function measurementAge(g) { const bd = S.settings.birthday; if (!bd) return null; return (parseYmd(g.date) - parseYmd(bd)) / DAY / 30.4375; }
function renderGrowth() {
  const rows = growthRows(), bd = S.settings.birthday, D = dis();
  const latest = {}; for (const k of Object.keys(GKINDS)) { const r = rows.filter(g => g[GKINDS[k].field]).pop(); if (r) latest[k] = r; }
  const pct = (k, g) => { const am = measurementAge(g); if (am == null || am < 0 || am > 24.5) return null; return phi(zScore(k, am, g[GKINDS[k].field])); };
  const tiles = Object.entries(GKINDS).map(([k, G]) => { const g = latest[k]; const p = g ? pct(k, g) : null;
    return `<div class="pct"><span class="label">${G.label}</span><span class="v">${g ? G.fmt(g[G.field]) : "—"}</span><span class="p">${p != null ? pctLabel(p) + " percentile" : g ? "Add birthday for percentile" : "Not measured"}</span></div>`; }).join("");
  const G = GKINDS[growthKind], pts = rows.filter(g => g[G.field]).map(g => ({ am: measurementAge(g), v: G.toUnit(g[G.field]), g })).filter(p => p.am != null && p.am >= 0 && p.am <= 24.5);
  const maxAge = pts.some(p => p.am > 10) || (age() && age().months > 10) ? 24 : 12;
  const Z = [[-1.881, "3rd"], [-1.036, "15th"], [0, "50th"], [1.036, "85th"], [1.881, "97th"]];
  const steps = [...Array(maxAge*2 + 1)].map((_, i) => i/2);
  const curves = Z.map(([z]) => steps.map(m => G.toUnit(valueAtZ(growthKind, m, z))));
  let lo = Math.min(...curves[0], ...pts.map(p => p.v)), hi = Math.max(...curves[4], ...pts.map(p => p.v));
  const pad = (hi - lo) * 0.04; lo = Math.floor(lo - pad); hi = Math.ceil(hi + pad);
  const W = 340, H = 220, L = 34, R = 34, T = 8, B = 26, pw = W - L - R, ph = H - T - B;
  const X = m => L + m / maxAge * pw, Y = v => T + (1 - (v - lo) / (hi - lo)) * ph;
  const path = arr => arr.map((v, i) => `${i ? "L" : "M"}${X(steps[i]).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const band = (a, b) => path(curves[a]) + curves[b].map((v, i, arr) => `L${X(steps[arr.length-1-i]).toFixed(1)},${Y(arr[arr.length-1-i]).toFixed(1)}`).join("") + "Z";
  const span = hi - lo, yStep = span > 60 ? 10 : span > 30 ? 5 : span > 12 ? 2 : 1;
  let grid = ""; for (let v = Math.ceil(lo / yStep) * yStep; v <= hi; v += yStep) grid += `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  for (let m = 0; m <= maxAge; m += maxAge === 24 ? 3 : 2) grid += `<text x="${X(m)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${m}</text>`;
  const labels = Z.map(([, n], i) => `<text x="${W-R+4}" y="${Y(curves[i][curves[i].length-1])+4}" font-size="9.5" fill="var(--muted)">${n}</text>`).join("");
  const line = pts.length > 1 ? `<path d="${pts.map((p, i) => `${i ? "L" : "M"}${X(p.am).toFixed(1)},${Y(p.v).toFixed(1)}`).join("")}" fill="none" stroke="var(--accent)" stroke-width="2"/>` : "";
  const dots = pts.map(p => `<circle cx="${X(p.am)}" cy="${Y(p.v)}" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("");
  const chart = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${G.label} for age chart with WHO percentile curves">
    ${grid}<path d="${band(0,4)}" fill="var(--band1)"/><path d="${band(1,3)}" fill="var(--band2)"/>
    ${curves.map((c, i) => `<path d="${path(c)}" fill="none" stroke="var(--sleep)" stroke-width="${i === 2 ? 1.6 : .8}" opacity="${i === 2 ? .9 : .5}"/>`).join("")}
    ${labels}${line}${dots}</svg>`;
  const list = rows.slice().reverse().map(g => { const parts = Object.entries(GKINDS).filter(([, K]) => g[K.field]).map(([k, K]) => { const p = pct(k, g); return `${K.fmt(g[K.field])}${p != null ? ` <span class="muted">(${pctLabel(p)})</span>` : ""}`; });
    const am = measurementAge(g);
    return `<li><div><b>${fmtDate(parseYmd(g.date))}</b>${am != null && am >= 0 ? ` <span class="muted small">· ${am < 3 ? Math.round(am*30.4375/7) + " wk" : am.toFixed(1) + " mo"}</span>` : ""}<div class="small">${parts.join(" · ")}</div>${g.note ? `<div class="small muted">${esc(g.note)}</div>` : ""}</div>
      <button class="edit btn alt" style="min-height:36px" data-gedit="${g.id}" ${D}>Edit</button></li>`; }).join("");
  $("#v-growth").innerHTML = `<div style="display:grid;gap:16px">
    <div class="card"><div class="card-head"><h2>Latest</h2><button class="btn" data-act="gadd" ${D}>+ Measurement</button></div>
      <div class="pct-grid">${tiles}</div>
      ${bd ? "" : `<p class="small muted">Add Ayla's birthday in Settings (under More) to see percentiles.</p>`}</div>
    <div class="card chart"><div class="seg" role="group" aria-label="Chart">${Object.entries(GKINDS).map(([k, K]) => `<button data-gkind="${k}" aria-pressed="${k === growthKind}">${K.label}</button>`).join("")}</div>
      ${chart}
      <p class="small muted">${G.label} (${G.unit()}) by age in months. Shaded: 3rd–97th and 15th–85th percentiles. WHO growth standards for girls, which the CDC recommends for children under 2.</p>
      ${pts.length ? "" : `<p class="small muted">${bd ? "Add a measurement to plot it here." : "Points appear here once her birthday is set."}</p>`}</div>
    <div class="card"><h2>All measurements</h2>${list ? `<ul class="mlist">${list}</ul>` : `<p class="empty">No measurements yet. Add them after each checkup.</p>`}
      <p class="small muted">Percentiles show where Ayla is compared with other girls her age. Her pediatrician looks at the trend over time, not a single number.</p></div>
  </div>`;
}

async function saveFile(filename, html) {
  let dl = null; try { dl = await window.claude?.use?.("downloads"); } catch(e) {}
  if (!dl) { // standalone app: hand the file to the phone's share sheet, or download it
    const file = new File([html], filename, { type: "text/html" });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return; } } catch (e) { if (e?.name === "AbortError") return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); return; }
  try { await dl.save({ filename, data: new Blob([html], { type: "text/html" }) }); toast("Saved."); }
  catch (e) { if (e?.code !== "declined") toast("That didn't save. Try Copy as text instead."); }
}
function copyText(txt) {
  const fallback = () => { const ta = $("#reportTxt"); if (ta) { ta.hidden = false; ta.value = txt; ta.select(); } toast("Select and copy the text below."); };

function reportDoc(title, inner) {

<style>body{font:15px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#222;max-width:720px;margin:24px auto;padding:0 16px}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:22px 0 6px;border-bottom:1px solid #ddd;padding-bottom:4px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:5px 6px;border-bottom:1px solid #eee;vertical-align:top}th{color:#666;font-weight:600}.muted{color:#666}ul{padding-left:20px;margin:6px 0}</style></head><body>${inner}</body></html>`;

function avgPerDay(t0, t1) {
  const days = []; for (let d = dayStart(t0); d < t1; d += DAY) days.push(d);
  const totals = days.map(d => ({ d, ...dayTotals(d) })), ev = allEvents().filter(e => e.start >= t0 && e.start < t1);
  const active = totals.filter(t => t.sleep || t.feeds || t.wet || t.dirty);
  const n = Math.max(1, active.length), sum = k => active.reduce((s, t) => s + t[k], 0);
  const nurseMs = ev.filter(e => e.type === "nurse" && e.end).reduce((s, e) => s + (e.end - e.start), 0);
  const bottles = ev.filter(e => e.type === "bottle"), bm = bottles.filter(b => b.milk !== "formula").reduce((s, b) => s + evMl(b), 0), fm = bottles.filter(b => b.milk === "formula").reduce((s, b) => s + evMl(b), 0);
  const sleeps = ev.filter(e => e.type === "sleep" && e.end), longest = sleeps.reduce((m, e) => Math.max(m, e.end - e.start), 0);

  return { n, days: days.length, feeds: sum("feeds") / n, nurse: nurseMs / n, bottleMl: sum("ml") / n, bm, fm, bottles: bottles.length,

    solids: ev.filter(e => e.type === "solids"), meds: ev.filter(e => e.type === "med"), temps: ev.filter(e => e.type === "temp"), pumpMl: sum("pumpMl") / n };
}

function buildPediatricianReport(t0, t1, questions) {

      const w = g.weightKg ? fmtWeight(g.weightKg) + P("weight", "weightKg") : "—", l = g.lengthCm ? fmtLen(g.lengthCm) + P("length", "lengthCm") : "—", h = g.headCm ? fmtLen(g.headCm) + P("head", "headCm") : "—";

function pregSheet(kind) {

    const body = `<div class="field"><label class="label" for="pw-date">Date</label><input type="date" id="pw-date" value="${ymd(now)}"></div>

      const kg = metric() ? v : v * KG_PER_LB; if (kg < 30 || kg > 250) return "Check that number."; save(P.put({ id: "w-" + date, type: "weight", date, kg: Math.round(kg * 100) / 100 })); });
  }
  if (kind === "profile") {
    const p = P.profile, M = metric();
    const hIn = p.heightCm ? p.heightCm / CM_PER_IN : null;
    const body = M ? `<div class="field"><label class="label" for="pp-h">Height (cm)</label><input id="pp-h" type="number" inputmode="decimal" value="${p.heightCm ? Math.round(p.heightCm) : ""}"></div>`

      <p class="small muted">Used to work out your pre-pregnancy BMI and recommended weight gain.</p>`, f => {
      const h = M ? Number(f.querySelector("#pp-h").value) : ((Number(f.querySelector("#pp-ft").value) || 0) * 12 + (Number(f.querySelector("#pp-in").value) || 0)) * CM_PER_IN;
      const w = Number(f.querySelector("#pp-w").value), kg = M ? w : w * KG_PER_LB;

  }
  if (kind === "bp") {
    const body = `<div class="field-row3"><div class="field"><label class="label" for="bp-s">Top (systolic)</label><input id="bp-s" type="number" inputmode="numeric" placeholder="120"></div>
      <div class="field"><label class="label" for="bp-d">Bottom (diastolic)</label><input id="bp-d" type="number" inputmode="numeric" placeholder="80"></div>
      <div class="field"><label class="label" for="bp-p">Pulse (optional)</label><input id="bp-p" type="number" inputmode="numeric"></div></div>${timeField("f-start", "Time", now)}`;
    return openSheet("Blood pressure", body, f => { const s = Number(f.querySelector("#bp-s").value), d = Number(f.querySelector("#bp-d").value), p = Number(f.querySelector("#bp-p").value) || null;
      if (!(s >= 60 && s <= 250 && d >= 30 && d <= 160 && s > d)) return "Check the numbers.";
      const e = { id: "bp-" + uid(), type: "bp", t: fromLocalInput(f.querySelector("#f-start").value) || now, sys: s, dia: d, pulse: p }; save(P.put(e));
      if (bpFlag(e)) toast(bpFlag(e) === "severe" ? "Very high reading. Call your provider now." : "High reading. Call your provider today."); });
  }
  if (kind === "temp") {
    const body = `<div class="field"><label class="label" for="pt-v">Temperature (°${useC() ? "C" : "F"})</label><input id="pt-v" type="number" inputmode="decimal" step="0.1"></div>${timeField("f-start", "Time", now)}`;
    return openSheet("Temperature", body, f => { const v = parseFloat(f.querySelector("#pt-v").value); if (isNaN(v)) return "Enter the temperature.";
      const c = useC() ? v : (v - 32) * 5/9; if (c < 33 || c > 43) return "Check that number.";
      save(P.put({ id: "pt-" + uid(), type: "ptemp", t: fromLocalInput(f.querySelector("#f-start").value) || now, c: Math.round(c * 100) / 100 }));
      if (c >= 38) toast("That's a fever. Call your provider."); });
  }
  if (kind === "sym") {
    const body = choice("Symptom", SYMPTOMS.map(s => [s, s]), "Nausea") + `<div class="field" id="sym-other-f"><label class="label" for="sym-other">If Other, what?</label><input id="sym-other" maxlength="60"></div>`
      + choice("How bad", [["1","Mild"],["2","Moderate"],["3","Severe"]], "1") + timeField("f-start", "When", now) + noteField("");
    return openSheet("Symptom", body, f => { let name = chosen(f, "Symptom"); if (name === "Other") name = f.querySelector("#sym-other").value.trim().slice(0, 60); if (!name) return "Describe the symptom.";
      save(P.put({ id: "s-" + uid(), type: "sym", t: fromLocalInput(f.querySelector("#f-start").value) || now, name, sev: Number(chosen(f, "How bad")), note: f.querySelector("#f-note").value.trim().slice(0, 300) })); });
  }
  if (kind === "med") {
    const names = [...new Set(P.list("pmed").map(m => m.name))].slice(-10);
    const body = `<div class="chips">${["Prenatal vitamin", ...names.filter(n => n !== "Prenatal vitamin")].map(n => `<button type="button" class="chipbtn" data-fill="${esc(n)}">${esc(n)}</button>`).join("")}</div>
      <div class="field"><label class="label" for="pm-n">Medicine or supplement</label><input id="pm-n" maxlength="60" placeholder="e.g. Prenatal vitamin, iron, Tylenol"></div>
      <div class="field"><label class="label" for="pm-d">Dose (optional)</label><input id="pm-d" maxlength="40"></div>${timeField("f-start", "Time", now)}`;
    const f = openSheet("Meds and vitamins", body, f => { const name = f.querySelector("#pm-n").value.trim().slice(0, 60); if (!name) return "Enter the name.";
      save(P.put({ id: "m-" + uid(), type: "pmed", t: fromLocalInput(f.querySelector("#f-start").value) || now, name, dose: f.querySelector("#pm-d").value.trim().slice(0, 40) })); });
    f.addEventListener("click", ev => { const b = ev.target.closest("[data-fill]"); if (b) f.querySelector("#pm-n").value = b.dataset.fill; });
  }
}

function toast(msg) { const t = document.createElement("div"); t.setAttribute("role","status");

// ---------- sheets ----------
function openSheet(title, body, onSave, onDelete, saveLabel = "Save") {
  $("#sheetRoot").innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="btn alt" data-sheet="close">Cancel</button></div>
    <form id="sheetForm" style="display:grid;gap:14px">${body}<div class="err" id="sheetErr"></div>
    <div class="foot">${onDelete ? `<button type="button" class="btn danger" data-sheet="del">Delete</button>` : ""}<button type="submit" class="btn">${saveLabel}</button></div>
    <div id="delConfirm"></div></form></div></div>`;
  pxTree($("#sheetRoot"));
  const f = $("#sheetForm");
  f.addEventListener("submit", ev => { ev.preventDefault(); const err = onSave(f); if (err) { $("#sheetErr").textContent = err; return; } closeSheet(); });
  $("#sheetRoot").onclick = ev => {
    if (ev.target.classList.contains("sheet-bg")) return closeSheet();
    const a = ev.target.closest("[data-sheet]"); if (!a) return;
    if (a.dataset.sheet === "close") closeSheet();
    if (a.dataset.sheet === "del") $("#delConfirm").innerHTML = `<div class="confirm"><span>Delete this entry? This can't be undone.</span><div class="foot"><button type="button" class="btn alt" data-sheet="nodel">Keep it</button><button type="button" class="btn danger" data-sheet="yesdel">Delete</button></div></div>`;
    if (a.dataset.sheet === "nodel") $("#delConfirm").innerHTML = "";
    if (a.dataset.sheet === "yesdel") { onDelete(); closeSheet(); }
  };
  f.querySelectorAll(".choice").forEach(c => c.addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return;
    c.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); c.dataset.value = b.dataset.v; c.dispatchEvent(new Event("pick", { bubbles: true })); }));
  f.querySelectorAll(".stepper").forEach(st => st.addEventListener("click", ev => { const b = ev.target.closest("button"); if (!b) return;
    const o = st.querySelector("output"), step = Number(b.dataset.d); let v = Math.max(0, Math.round((parseFloat(o.value) + step) * 100) / 100); o.value = v; st.dataset.value = v; st.dispatchEvent(new Event("pick", { bubbles: true })); }));
  setTimeout(() => f.querySelector("input,select,button")?.focus({ preventScroll: true }), 50);
  return f;
}
function closeSheet() { $("#sheetRoot").innerHTML = ""; render(); }
const choice = (name, opts, val) => `<div class="field"><span class="label">${name}</span><div class="choice" data-name="${name}" data-value="${val}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === val}">${l}</button>`).join("")}</div></div>`;

const noteField = v => `<div class="field"><label class="label" for="f-note">Note (optional)</label><textarea id="f-note" rows="2" maxlength="500">${esc(v || "")}</textarea></div>`;

function editEvent(e, type, kind) {
  const isNew = !e;
  if (isNew && !type) {
    const body = choice("Type", [["sleep","Sleep"],["nurse","Nursing"],["bottle","Bottle"],["pump","Pumping"],["diaper","Diaper"],["solids","Solids"],["activity","Activity"],["med","Medicine"],["temp","Temperature"],["potty","Potty"]], "sleep");
    openSheet("Add past entry", body, f => { const t = chosen(f, "Type"); setTimeout(() => editEvent({ id: uid(), type: t, kind: t === "activity" ? "tummy" : undefined, start: Date.now() - HOUR, end: TIMED.has(t) && t !== "pump" ? Date.now() : null, _new: true }), 0); }, null, "Next");
    return;
  }
  e = e ? { ...e } : { id: uid(), type, kind, start: Date.now(), end: null };
  const creating = isNew || e._new, prev = creating ? null : { ...S.events.get(e.id) };
  const T = e.type, timed = TIMED.has(T) && !(T === "activity" && INSTANT_ACT.has(e.kind) && !e.end);
  let body = "";
  if (T === "activity") body += choice("Activity", Object.entries(ACTIVITIES), e.kind || "tummy");
  body += timeField("f-start", timed ? "Started" : "Time", e.start);
  if (timed) body += timeField("f-end", T === "pump" ? "Ended (optional)" : e.end || creating ? "Ended" : "Ended (leave blank if still going)", e.end);

  if (T === "solids") body += `<div class="field"><label class="label" for="f-food">What she ate</label><input id="f-food" maxlength="120" value="${esc(e.food || "")}" placeholder="e.g. mashed avocado"></div>`;

    body += `<div class="field"><label class="label" for="f-medname">Medicine</label><input id="f-medname" list="medlist" maxlength="60" value="${esc(e.name || "")}" placeholder="e.g. infant acetaminophen, vitamin D drops"><datalist id="medlist">${names.map(n => `<option value="${esc(n)}">`).join("")}</datalist></div>
    <div class="field"><label class="label" for="f-dose">Dose given</label><input id="f-dose" maxlength="40" value="${esc(e.dose || "")}" placeholder="e.g. 2.5 ml, 1 drop"></div>
    <p class="small muted">Give doses as her pediatrician or the label says. This only records what was given, so everyone can see the last dose.</p>`; }
  if (T === "temp") { const c = e.c != null ? Number(e.c) : null, shown = c == null ? "" : useC() ? c.toFixed(1) : (c * 9/5 + 32).toFixed(1);
    body += `<div class="field"><label class="label" for="f-temp">Temperature (°${useC() ? "C" : "F"})</label><input id="f-temp" type="number" inputmode="decimal" step="0.1" value="${shown}" placeholder="${useC() ? "37.0" : "98.6"}"></div>`
      + choice("Taken by", [["rectal","Rectal"],["armpit","Armpit"],["forehead","Forehead"],["ear","Ear"],["oral","Mouth"]], e.method || "rectal") + `<div id="feverNote"></div>`; }
  body += noteField(e.note);

    else out.end = null;

    if (T === "bottle") { out.ml = Math.round(fromVolDisplay(f.querySelector("#st-amt").dataset.value)); out.milk = chosen(f, "Milk"); if (!out.ml) return "Enter the amount."; }
    if (T === "pump") { out.leftMl = Math.round(fromVolDisplay(f.querySelector("#st-l").dataset.value)); out.rightMl = Math.round(fromVolDisplay(f.querySelector("#st-r").dataset.value)); }
    if (T === "diaper") out.diaper = chosen(f, "Diaper");
    if (T === "solids") out.food = f.querySelector("#f-food").value.trim().slice(0, 120);
    if (T === "potty") out.result = chosen(f, "Result");
    if (T === "activity") { out.kind = chosen(f, "Activity"); if (INSTANT_ACT.has(out.kind) && !timed) out.end = null; }
    if (T === "med") { out.name = f.querySelector("#f-medname").value.trim().slice(0, 60); out.dose = f.querySelector("#f-dose").value.trim().slice(0, 40); if (!out.name) return "Enter the medicine."; }
    if (T === "temp") { const v = parseFloat(f.querySelector("#f-temp").value); if (isNaN(v)) return "Enter the temperature.";
      const c = useC() ? v : (v - 32) * 5/9; if (c < 33 || c > 43) return "Check that number."; out.c = Math.round(c * 100) / 100; out.method = chosen(f, "Taken by"); }
    out.note = f.querySelector("#f-note").value.trim().slice(0, 500);
    if (timed && !out.end && T !== "pump") { const other = activeOf(T); if (other && other.id !== out.id) return `A ${T === "activity" ? "activity" : TYPE_NAMES[T].toLowerCase()} timer is already running. Stop it first.`; }
    save(S.putEvent(out, prev));
    if (T === "temp" && out.c >= FEVER_C) feverToast(out.c);
  }, creating ? null : () => save(S.delEvent(prev)));
  if (T === "pump") { const upd = () => { const l = Number(f.querySelector("#st-l").dataset.value) || 0, r = Number(f.querySelector("#st-r").dataset.value) || 0; f.querySelector("#pumpTotal").textContent = `Total: ${Math.round((l + r) * 100) / 100} ${volUnit()}`; }; upd(); f.addEventListener("pick", upd); }
  if (T === "temp") { const inp = f.querySelector("#f-temp"), upd = () => { const v = parseFloat(inp.value); const c = isNaN(v) ? null : useC() ? v : (v - 32) * 5/9;
      f.querySelector("#feverNote").innerHTML = c != null && c >= FEVER_C ? `<div class="banner warn small">${feverText()}</div>` : ""; }; inp.addEventListener("input", upd); upd(); }
}
function feverText() { const a = age();
  const young = a && !a.unborn && a.days < 90;
  return young ? "<b>That's a fever (100.4°F / 38°C or higher).</b> For babies under 3 months, call her pediatrician right away, even at night."
    : "<b>That's a fever (100.4°F / 38°C or higher).</b> Call her pediatrician if you're worried, if it lasts, or if she seems very sleepy, isn't feeding, or has trouble breathing."; }
function feverToast() { const a = age(); if (a && !a.unborn && a.days < 90) toast("Fever logged. Under 3 months: call her pediatrician right away."); }

function editGrowth(g) {
  const isNew = !g; g = g || { id: uid(), date: ymd(Date.now()) };
  const M = metric(), w = g.weightKg && !M ? kgToLbOz(g.weightKg) : null;
  const lenV = cm => cm ? (M ? cm.toFixed(1) : (cm / CM_PER_IN).toFixed(1)) : "";
  const body = `<div class="field"><label class="label" for="g-date">Date measured</label><input type="date" id="g-date" value="${g.date}"></div>
    ${M ? `<div class="field"><label class="label" for="g-kg">Weight (kg)</label><input id="g-kg" type="number" inputmode="decimal" step="0.01" min="0" max="30" value="${g.weightKg ? g.weightKg.toFixed(2) : ""}"></div>`
        : `<div class="field"><span class="label">Weight</span><div class="field-row"><input id="g-lb" type="number" inputmode="numeric" min="0" max="60" placeholder="lb" aria-label="Pounds" value="${w ? w.lb : ""}"><input id="g-oz" type="number" inputmode="decimal" min="0" max="15.9" step="0.1" placeholder="oz" aria-label="Ounces" value="${w ? w.oz : ""}"></div></div>`}
    <div class="field-row"><div class="field"><label class="label" for="g-len">Length (${M ? "cm" : "in"})</label><input id="g-len" type="number" inputmode="decimal" step="0.1" value="${lenV(g.lengthCm)}"></div>
    <div class="field"><label class="label" for="g-head">Head (${M ? "cm" : "in"})</label><input id="g-head" type="number" inputmode="decimal" step="0.1" value="${lenV(g.headCm)}"></div></div>
    ${noteField(g.note)}
    <p class="small muted">Fill in whatever the pediatrician measured. Blank fields are fine.</p>`;
  openSheet(isNew ? "Add measurement" : "Edit measurement", body, f => {
    const date = f.querySelector("#g-date").value; if (!date) return "Enter the date.";
    const len = f.querySelector("#g-len").value, head = f.querySelector("#g-head").value, out = { id: g.id, date };
    let kg = null;
    if (M) { const v = f.querySelector("#g-kg").value; if (v !== "") kg = Number(v); }
    else { const lb = f.querySelector("#g-lb").value, oz = f.querySelector("#g-oz").value; if (lb !== "" || oz !== "") kg = ((Number(lb) || 0) + (Number(oz) || 0) / 16) * KG_PER_LB; }
    if (kg != null) { if (kg < 0.8 || kg > 30) return "Check the weight."; out.weightKg = Math.round(kg * 1000) / 1000; }
    const toCm = v => M ? Number(v) : Number(v) * CM_PER_IN;
    if (len !== "") { const cm = toCm(len); if (cm < 30 || cm > 115) return "Check the length."; out.lengthCm = Math.round(cm * 10) / 10; }
    if (head !== "") { const cm = toCm(head); if (cm < 25 || cm > 60) return "Check the head measurement."; out.headCm = Math.round(cm * 10) / 10; }
    if (!out.weightKg && !out.lengthCm && !out.headCm) return "Enter at least one measurement.";
    out.note = f.querySelector("#f-note").value.trim().slice(0, 500);
    save(S.putGrowth(out));
  }, isNew ? null : () => save(S.delGrowth(g)));
}

// ---------- actions ----------
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act],[data-edit],[data-gedit],[data-day],[data-gkind],[data-age],[data-goage],[data-first],[data-check],[data-visit],[data-filter],[data-msjump],[data-pact],[data-pweek],[data-pmood],[data-pdel],[data-vax]"); if (!el) return;
  if (el.closest("#sheetRoot")) return;
  const now = Date.now();
  if (el.dataset.edit) return editEvent(S.events.get(el.dataset.edit));
  if (el.dataset.vax) return editVaccine(el.dataset.vax);
  if (el.dataset.pweek) { pregWeek = Math.max(4, Math.min(40, pregWeek + Number(el.dataset.pweek))); return render(); }
  if (el.dataset.pmood) { const d = P.day(ymd(now)); return save(P.put({ ...d, mood: Number(el.dataset.pmood) })); }
  if (el.dataset.pdel) { const e = P.entries.get(el.dataset.pdel); if (e) { if (el.dataset.confirm === "1") return save(P.del(e)); el.dataset.confirm = "1"; el.textContent = "Sure?"; setTimeout(() => { el.dataset.confirm = ""; el.textContent = "Delete"; }, 3000); } return; }
  if (el.dataset.pact) { const k = el.dataset.pact, d = P.day(ymd(now));
    if (k === "cstart") return save(P.put({ id: "c-" + uid(), type: "contr", start: now, end: null }));
    if (k === "cstop") { const c = P.list("contr").filter(c => !c.end).pop(); if (c) save(P.put({ ...c, end: now })); return; }
    if (k === "kickstart") { kickSession = { start: now, count: 0 }; local.set("kick", JSON.stringify(kickSession)); return render(); }
    if (k === "kick") { kickSession.count++; local.set("kick", JSON.stringify(kickSession));
      if (kickSession.count >= 10) { const ks = kickSession; kickSession = null; local.set("kick", null); save(P.put({ id: "k-" + uid(), type: "kicks", start: ks.start, end: now, count: ks.count })); toast(`10 movements in ${dur(now - ks.start)}.`); return; }
      return render(); }
    if (k === "kickstop") { const ks = kickSession; kickSession = null; local.set("kick", null); if (ks && ks.count) save(P.put({ id: "k-" + uid(), type: "kicks", start: ks.start, end: now, count: ks.count })); else render(); return; }
    if (k === "w+" || k === "w-") return save(P.put({ ...d, water: Math.max(0, (Number(d.water) || 0) + (k === "w+" ? 1 : -1)) }));
    if (k === "s+" || k === "s-") return save(P.put({ ...d, sleepH: Math.max(0, Math.min(14, (d.sleepH == null ? 7 : Number(d.sleepH)) + (k === "s+" ? 0.5 : -0.5))) }));
    return pregSheet(k); }
  if (el.dataset.gedit) return editGrowth(S.growth.get(el.dataset.gedit));
  if (el.dataset.first) return editFirst(el.dataset.first);
  if (el.dataset.visit) return editVisit(el.dataset.visit);
  if (el.dataset.msjump) { msOpen = Number(el.dataset.msjump); render(); return setTimeout(() => document.querySelector(`[data-grp="${msOpen}"]`)?.scrollIntoView({ block: "start" }), 30); }
  if (el.dataset.check) { const k = el.dataset.check, c = S.col.checks.get(k); msOpen = Number(k.split("-")[0].slice(1));
    return save(c ? S.delDoc("checks", c) : S.putDoc("checks", { id: k, date: ymd(now) })); }
  if (el.dataset.filter) { logFilter = el.dataset.filter; return render(); }
  if (el.dataset.day) { logDay = dayStart(logDay + Number(el.dataset.day) * DAY + 2*HOUR); S.ensureMonths(logDay); return render(); }
  if (el.dataset.gkind) { growthKind = el.dataset.gkind; return render(); }
  if (el.dataset.age) { const i = AGES.findIndex(a => a.id === schedAge) + Number(el.dataset.age); schedAge = AGES[Math.max(0, Math.min(AGES.length-1, i))].id; return render(); }
  if (el.dataset.goage) { schedAge = el.dataset.goage; render(); return window.scrollTo(0, 0); }
  const act = el.dataset.act;
  if (act === "sleep") { const n = activeOf("nurse"); (async () => { if (n) await save(S.putEvent({ ...n, end: now })); await save(S.putEvent({ id: uid(), type: "sleep", start: now + (n ? 1 : 0), end: null })); })(); return; }
  if (act === "wake") { const s = activeOf("sleep"); if (s) save(S.putEvent({ ...s, end: now })); return; }
  if (act === "nurse-L" || act === "nurse-R") { const side = act.slice(-1), n = activeOf("nurse");
    (async () => { if (n) await save(S.putEvent({ ...n, end: now })); await save(S.putEvent({ id: uid(), type: "nurse", side, start: now + (n ? 1 : 0), end: null })); })(); return; }
  if (act === "nurse-done") { const n = activeOf("nurse"); if (n) save(S.putEvent({ ...n, end: now })); return; }
  if (act?.startsWith("act-")) { const k = act.slice(4);
    if (k === "done") { const a = activeOf("activity"); if (a) save(S.putEvent({ ...a, end: now })); return; }
    if (INSTANT_ACT.has(k)) return editEvent(null, "activity", k);
    const cur = activeOf("activity");
    (async () => { if (cur) await save(S.putEvent({ ...cur, end: now })); await save(S.putEvent({ id: uid(), type: "activity", kind: k, start: now + (cur ? 1 : 0), end: null })); toast(`${ACTIVITIES[k]} started.`); })(); return; }
  if (act?.startsWith("new-")) return editEvent(null, act.slice(4));
  if (act === "add") return editEvent(null, null);
  if (act === "gadd") return editGrowth(null);
  if (act === "addfirst") return editFirst("new");
  if (act === "vaxadd") return addVaccines();
  if (act === "tabs-reset") { local.set("tabs", null); render(); return toast("Bottom bar reset."); }
  if (act === "report") { ev.preventDefault(); return pediatricianReport(); }
  if (act === "vaxreport") return vaccineReport();
  if (act === "import") return importLocal();
  if (act === "wake-reset") { manualWake = null; local.set("wake", null); return render(); }
  if (act === "backup") { const txt = JSON.stringify({ app: "aylas-days", v: 2, events: [...S.events.values()], growth: [...S.growth.values()], settings: S.settings, firsts: [...S.col.firsts.values()], checks: [...S.col.checks.values()], visits: [...S.col.visits.values()], vaccines: [...S.col.vaccines.values()], pregnancy: { profile: P.profile, entries: [...P.entries.values()] } });
    const fallback = () => { const ta = $("#restoreTxt"); ta.value = txt; ta.select(); toast("Copy the selected text to keep it."); };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(() => toast("Backup copied. Paste it into Notes to keep it."), fallback); else fallback(); return; }
  if (act === "restore") { let d; try { d = JSON.parse($("#restoreTxt").value); } catch(e) { return toast("That doesn't look like a backup. Paste the whole thing."); }
    if (d?.app !== "aylas-days") return toast("That doesn't look like a backup from this page.");
    (async () => { for (const e of d.events || []) await save(S.putEvent(e)); for (const g of d.growth || []) await save(S.putGrowth(g));
      for (const c of ["firsts","checks","visits","vaccines"]) for (const o of d[c] || []) if (o && o.id) await save(S.putDoc(c, o));
      if (d.pregnancy) { if (d.pregnancy.profile && Object.keys(d.pregnancy.profile).length) await save(P.setProfile(d.pregnancy.profile)); for (const e of d.pregnancy.entries || []) if (e && e.id) await save(P.put(e)); }
      if (d.settings) await save(S.putSettings(d.settings)); toast(`Restored ${(d.events||[]).length} log entries and ${(d.growth||[]).length} measurements.`); })(); return; }
});
document.addEventListener("change", ev => {
  const id = ev.target.id, v = ev.target.value;
  if (id === "bday") { local.set("bday", v || null); schedAge = null; msOpen = null; save(S.putSettings({ birthday: v || null })); }
  if (id === "wake") { manualWake = v ? toMin(v) : null; local.set("wake", v || null); local.set("wakeDay", ymd(Date.now())); render(); }
  if (id === "agesel") { schedAge = v; render(); }
  if (ev.target.dataset.tabslot != null) { const t = [0,1,2,3].map(i => $("#tab-" + i)?.value || "").filter(Boolean);
    if (t.length < 2) { toast("Keep at least two tabs."); return render(); } local.set("tabs", JSON.stringify(t)); render(); toast("Bottom bar updated."); }
  if (id === "set-name") save(S.putSettings({ babyName: v.trim().slice(0, 30) }));
  if (id === "set-parent") save(S.putSettings({ parentName: v.trim().slice(0, 30) }));
  if (id === "set-sex") save(S.putSettings({ sex: v === "boy" ? "boy" : "girl" }));
  if (id === "set-units") save(S.putSettings({ units: v }));
  if (id === "set-temp") save(S.putSettings({ temp: v }));
  if (id === "set-clock") save(S.putSettings({ clock: v }));
  if (id === "set-theme") { if (v === "auto") { delete root.dataset.theme; local.set("theme", null); } else { root.dataset.theme = v; local.set("theme", v); } syncThemeBtn(); }
});
document.addEventListener("toggle", ev => { if (ev.target.id === "safeBox" && !ev.target.open) local.set("safeSeen", "1");
  if (ev.target.dataset?.grp) { const m = Number(ev.target.dataset.grp); if (ev.target.open) msOpen = m; else if (msOpen === m) msOpen = -1; } }, true);

// ---------- theme ----------
const root = document.documentElement;
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function syncThemeBtn() { $("#themeBtn").textContent = isDark() ? "Day mode" : "Night mode"; }
const savedTheme = local.get("theme"); if (savedTheme) root.dataset.theme = savedTheme;
$("#themeBtn").addEventListener("click", () => { const t = isDark() ? "light" : "dark"; root.dataset.theme = t; local.set("theme", t); syncThemeBtn(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", syncThemeBtn);
syncThemeBtn();

// ---------- boot ----------
S.loadLocal(); P.load();
try { kickSession = JSON.parse(local.get("kick") || "null"); } catch(e) {}
setView(location.hash.slice(1) || "today");
initShared();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
